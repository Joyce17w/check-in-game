<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon source. Three cards for the game's arc (deep, warm, and the
       paper card you hold), with a gold token carrying a check: a check-in.
       Full-bleed square: the phone rounds the corners. Everything important
       sits inside the middle 80% so it also works as a maskable icon.
       Re-render the PNGs with: npm run icons -->
  <defs>
    <radialGradient id="night" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#4A2C78"/>
      <stop offset="0.55" stop-color="#2A1848"/>
      <stop offset="1" stop-color="#150B26"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB98A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFB98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F96FF"/>
      <stop offset="1" stop-color="#5B3FD6"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC79A"/>
      <stop offset="1" stop-color="#F0607F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#F6E8CF"/>
    </linearGradient>
    <radialGradient id="gold" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE9A6"/>
      <stop offset="0.5" stop-color="#F8B531"/>
      <stop offset="1" stop-color="#D98A0B"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0A0414" flood-opacity="0.55"/>
    </filter>
    <filter id="liftSoft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A0414" flood-opacity="0.45"/>
    </filter>
    <filter id="coin" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7A4A00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#night)"/>
  <ellipse cx="512" cy="600" rx="470" ry="400" fill="url(#glow)"/>

  <!-- back cards, fanned from a point below the icon -->
  <g filter="url(#liftSoft)">
    <g transform="rotate(-17 512 1150)">
      <rect x="342" y="262" width="340" height="476" rx="52" fill="url(#deep)"/>
      <rect x="342" y="262" width="340" height="476" rx="52" fill="url(#sheen)"/>
    </g>
  </g>
  <g filter="url(#liftSoft)">
    <g transform="rotate(17 512 1150)">
      <rect x="342" y="262" width="340" height="476" rx="52" fill="url(#warm)"/>
      <rect x="342" y="262" width="340" height="476" rx="52" fill="url(#sheen)"/>
    </g>
  </g>

  <!-- the card in hand -->
  <g filter="url(#lift)">
    <rect x="332" y="236" width="360" height="504" rx="56" fill="url(#paper)"/>
  </g>
  <rect x="334" y="238" width="356" height="500" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>

  <!-- gold token with a check -->
  <g filter="url(#coin)">
    <circle cx="512" cy="488" r="112" fill="url(#gold)"/>
  </g>
  <circle cx="512" cy="488" r="96" fill="none" stroke="#FFF3C4" stroke-opacity="0.75" stroke-width="5"/>
  <path d="M462 492 l36 36 l66 -78" fill="none" stroke="#2A1338" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

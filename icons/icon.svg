<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon source. Flat and matte, like the app: a deep teal field,
       three cards, and a bold check for "check-in".
       Full-bleed square: the phone rounds the corners. Everything important
       sits inside the middle 80% so it also works as a maskable icon.
       Re-render the PNGs with: npm run icons -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.5 0"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#12403C"/>
  <rect x="352" y="282" width="320" height="456" rx="26" fill="#141B4D" transform="rotate(-15 512 1240)"/>
  <rect x="352" y="282" width="320" height="456" rx="26" fill="#6B1F2E" transform="rotate(15 512 1240)"/>
  <rect x="342" y="256" width="340" height="484" rx="28" fill="#F3EFE6"/>
  <path d="M436 502 l54 54 l100 -122" fill="none" stroke="#141416" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay" opacity="0.45"/>
</svg>
